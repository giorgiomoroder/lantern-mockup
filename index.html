<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lantern field 3D mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8e5de; --panel:#f7f5f0; --ink:#1d1c1a; --muted:#5d5a54; --line:#c9c4b8; --on:#1d1c1a; --on-ink:#f7f5f0; --hook:#9db000;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#17171b; --panel:#222228; --ink:#efece6; --muted:#a8a49b; --line:#3b3a42; --on:#efece6; --on-ink:#17171b; --hook:#c8e600; }
}
:root[data-theme="dark"]{ --bg:#17171b; --panel:#222228; --ink:#efece6; --muted:#a8a49b; --line:#3b3a42; --on:#efece6; --on-ink:#17171b; --hook:#c8e600; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,"Helvetica Neue",Arial,sans-serif;font-size:15px;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:17px;font-weight:600;margin:0 6px 0 0;letter-spacing:.01em}
.group{display:flex;align-items:center;gap:6px}
.group span{color:var(--muted);font-size:13px}
button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer;white-space:nowrap}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button[aria-pressed="true"]{background:var(--on);color:var(--on-ink);border-color:var(--on)}
.doc{font-size:14px;font-weight:600;color:var(--on-ink);background:var(--on);border-radius:4px;padding:6px 10px;text-decoration:none;white-space:nowrap}
.doc:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#stage{flex:1;min-height:0;position:relative}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.views{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line)}
.hint{position:absolute;left:12px;bottom:10px;font-size:13px;color:#fff;background:rgba(0,0,0,.55);padding:4px 8px;border-radius:4px;pointer-events:none;max-width:calc(100% - 24px)}
.msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
</style>
</head>
<body>
<div class="top">
  <h1>Lantern field mockup</h1>
  <a class="doc" href="build-sheet.html">Open the build sheet</a>
  <div class="group"><span>Look</span>
    <button id="lookWork" aria-pressed="false">Work light</button>
    <button id="lookShow" aria-pressed="true">Show</button>
  </div>
  <div class="group"><span>Strap spacing</span>
    <button id="sp46" aria-pressed="true">46 in</button>
    <button id="sp36" aria-pressed="false">36 in</button>
  </div>
  <div class="group">
    <button id="tIds" aria-pressed="false">Strap and lantern IDs</button>
    <button id="tLim" aria-pressed="false">9 ft and 15 ft lines</button>
    <button id="tRoom" aria-pressed="true">Tables and chairs</button>
  </div>
</div>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="hint">Drag to orbit. Scroll or pinch to zoom. Right-drag or two fingers to pan.</div>
  <div class="msg" id="msg">The 3D library did not load, so the model cannot be shown. Check the connection and reload.</div>
</div>
<div class="views" id="views"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(!window.THREE){ document.getElementById('msg').style.display='flex'; return; }

var DATA={
A:[[33,36,60],[60,18,39],[90,30,27],[135,20,72],[168,30,54],[207,18,36]],
B:[[27,20,24],[63,36,57],[105,30,69],[138,36,42],[180,18,30],[210,20,60]],
C:[[36,20,72],[75,30,48],[108,18,24],[132,20,57],[177,36,66],[204,18,21]],
D:[[24,18,51],[60,20,69],[90,36,45],[129,20,33],[156,36,54],[195,30,30]],
E:[[39,20,51],[78,18,27],[114,20,54],[147,30,66],[162,18,36],[192,36,60]],
F:[[33,30,33],[84,18,63],[111,36,36],[144,18,54],[174,30,42],[210,20,72]],
G:[[45,30,27],[72,36,66],[102,20,45],[126,30,69],[168,36,30],[201,18,51]]
};
var NAMES=['A','B','C','D','E','F','G'];
var STRAP_H=16, SPAN=20.7, HALF=SPAN/2, TRUSS_Y=16.5;

var canvas=document.getElementById('c'), stage=document.getElementById('stage');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(45,1,0.1,600);

var hemi=new THREE.HemisphereLight(0xffffff,0x8a8780,0.95); scene.add(hemi);
var sun=new THREE.DirectionalLight(0xffffff,0.55); sun.position.set(30,60,25); scene.add(sun);
var glowLights=[];
[[-8,-5],[0,-5],[8,-5],[-8,5],[0,5],[8,5]].forEach(function(p){
  var l=new THREE.PointLight(0xffc488,0.9,48,2); l.position.set(p[0],12,p[1]); scene.add(l); glowLights.push(l);
});

function paperTexture(){
  var cv=document.createElement('canvas'); cv.width=32; cv.height=256; var g=cv.getContext('2d');
  g.fillStyle='#ffffff'; g.fillRect(0,0,32,256); g.fillStyle='rgba(120,110,95,0.16)';
  for(var y=6;y<256;y+=12){ g.fillRect(0,y,32,1.5); }
  return new THREE.CanvasTexture(cv);
}
var paper=paperTexture();
var matLanternWork=new THREE.MeshStandardMaterial({color:0xffffff,map:paper,roughness:0.95});
var matLanternShow=new THREE.MeshBasicMaterial({color:0xffdfb0,map:paper});
var matGlow=new THREE.MeshBasicMaterial({color:0xffb060,transparent:true,opacity:0.13,blending:THREE.AdditiveBlending,side:THREE.BackSide,depthWrite:false});
var matBlack=new THREE.MeshBasicMaterial({color:0x111111});
var matCord=new THREE.MeshBasicMaterial({color:0x222222});
var matHook=new THREE.MeshBasicMaterial({color:0xc8e600});
var matTruss=new THREE.MeshStandardMaterial({color:0x7d7d7d,transparent:true,opacity:0.4,roughness:0.6});
var matFloor=new THREE.MeshStandardMaterial({color:0xd6d2c9,roughness:0.95});
var matDance=new THREE.MeshStandardMaterial({color:0xbdb7aa,roughness:0.35});
var matWall=new THREE.MeshStandardMaterial({color:0xe3dfd6,roughness:1});
var matTable=new THREE.MeshStandardMaterial({color:0xf3efe6,roughness:0.9});
var matPerson=new THREE.MeshStandardMaterial({color:0x8d99a6,roughness:0.9});

function textSprite(text,size,fg,bg){
  var cv=document.createElement('canvas'); cv.width=160; cv.height=80; var g=cv.getContext('2d');
  g.font='600 52px Barlow, Arial, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  if(bg){ g.fillStyle=bg; g.fillRect(8,8,144,64); }
  g.fillStyle=fg; g.fillText(text,80,42);
  var s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),depthTest:false,transparent:true}));
  s.scale.set(size*2,size,1); s.renderOrder=20; return s;
}

var straps=[], lanternMeshes=[], glowMeshes=[], idSprites=[];
NAMES.forEach(function(n,k){
  var g=new THREE.Group();
  var web=new THREE.Mesh(new THREE.BoxGeometry(0.17,0.04,SPAN),matBlack); web.position.y=STRAP_H-0.03; g.add(web);
  var hook=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.45,0.45),matHook); hook.position.set(0,STRAP_H-0.12,-HALF); g.add(hook);
  var letter=textSprite(n,1.5,'#111111','#c8e600'); letter.position.set(0,STRAP_H+1.6,-HALF); letter.visible=false; g.add(letter); idSprites.push(letter);
  DATA[n].forEach(function(d,i){
    var r=d[1]/24, cy=STRAP_H-d[2]/12, z=-HALF+d[0]/12;
    var m=new THREE.Mesh(new THREE.SphereGeometry(r,32,20),matLanternShow); m.position.set(0,cy,z); g.add(m); lanternMeshes.push(m);
    var gl=new THREE.Mesh(new THREE.SphereGeometry(r*1.4,20,14),matGlow); gl.position.copy(m.position); g.add(gl); glowMeshes.push(gl);
    var len=STRAP_H-(cy+r);
    var cord=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,len,5),matCord); cord.position.set(0,STRAP_H-len/2,z); g.add(cord);
    var id=textSprite(n+(i+1),0.9,'#111111','rgba(255,255,255,0.85)'); id.position.set(0,cy,z); id.visible=false; g.add(id); idSprites.push(id);
  });
  scene.add(g); straps.push(g);
});

function plane(w,h,mat){ return new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat); }
var floor=plane(124,37,matFloor); floor.rotation.x=-Math.PI/2; floor.position.set(8,0,-5.5); scene.add(floor);
var dance=plane(24,24,matDance); dance.rotation.x=-Math.PI/2; dance.position.set(0,0.02,0.6); scene.add(dance);
var matStage=new THREE.MeshStandardMaterial({color:0x3a3a40,roughness:0.85});
var matDrape=new THREE.MeshStandardMaterial({color:0x4a2f3a,roughness:1});
var matBand=new THREE.MeshStandardMaterial({color:0xf4f1ea,roughness:0.7});
var riser=new THREE.Mesh(new THREE.BoxGeometry(24,2,12),matStage); riser.position.set(0,1,-18); scene.add(riser);
var drape=plane(24,16,matDrape); drape.position.set(0,10,-23.8); scene.add(drape);
(function(){
  var F={B:['11110','10001','10001','11110','10001','10001','11110'],A:['01110','10001','10001','11111','10001','10001','10001'],
         N:['10001','11001','10101','10011','10001','10001','10001'],D:['11110','10001','10001','10001','10001','10001','11110']};
  var v=0.6, x0=-(23*v)/2, geo=new THREE.BoxGeometry(v,v,0.8);
  'BAND'.split('').forEach(function(ch,li){ F[ch].forEach(function(row,r){ for(var c=0;c<5;c++){ if(row.charAt(c)==='1'){
    var m=new THREE.Mesh(geo,matBand); m.position.set(x0+(li*6+c)*v+v/2, 2+(6-r)*v+v/2, -18); scene.add(m); } } }); });
})();
var stageLight=new THREE.PointLight(0xcfd8ff,0.9,40,2); stageLight.position.set(0,11,-15); scene.add(stageLight);
var wallBack=plane(124,22,matWall); wallBack.position.set(8,11,-24); scene.add(wallBack);
var wallFront=plane(124,22,matWall); wallFront.rotation.y=Math.PI; wallFront.position.set(8,11,13); scene.add(wallFront);
var wallLeft=plane(37,22,matWall); wallLeft.rotation.y=Math.PI/2; wallLeft.position.set(-54,11,-5.5); scene.add(wallLeft);

function truss(x0,x1,z){ var m=new THREE.Mesh(new THREE.BoxGeometry(x1-x0,1,1),matTruss); m.position.set((x0+x1)/2,TRUSS_Y,z); scene.add(m); }
truss(-53,20,-21.2); truss(-53,38,-HALF); truss(-53,38,0); truss(-53,20,HALF);
var ring=new THREE.Mesh(new THREE.TorusGeometry(9.84,0.5,8,48),matTruss); ring.rotation.x=Math.PI/2; ring.position.set(-6,TRUSS_Y,-5); scene.add(ring);

var extras=new THREE.Group(); scene.add(extras);
function roundTable(x,z,r){ var t=new THREE.Mesh(new THREE.CylinderGeometry(r,r,0.12,28),matTable); t.position.set(x,2.5,z); extras.add(t);
  var leg=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.25,2.5,8),matTable); leg.position.set(x,1.25,z); extras.add(leg); }
function longTable(x,z){ var t=new THREE.Mesh(new THREE.BoxGeometry(10,0.12,3.5),matTable); t.position.set(x,2.5,z); extras.add(t); }
var ROUNDS=[[-44.1,-17.9,3],[-31.4,-15.5,3],[-18.4,-17.9,3.5],[-43.6,7.7,3],[-31.4,5.8,3],[-18.4,7.9,3],[20.6,-14.8,3],[32.6,-17.9,3.5],[46.3,-15.5,3],[59.5,-16.9,3.5],[19.7,4.8,3],[29.9,7.9,3.5],[41.1,5.9,3],[53.5,7.0,3.5],[65.8,5.9,3]];
var LONGS=[-41.2,-31.3,-21.5,24.9,34.4,44.4,54.8], LONG_Z=-4.9;
ROUNDS.forEach(function(t){ roundTable(t[0],t[1],t[2]); });
LONGS.forEach(function(x){ longTable(x,LONG_Z); });
var chairs=[];
ROUNDS.forEach(function(t){ var n=t[2]>3.2?12:10, R=t[2]+0.9; for(var i=0;i<n;i++){ var a=i/n*Math.PI*2; chairs.push([t[0]+R*Math.sin(a),t[1]+R*Math.cos(a),a]); } });
LONGS.forEach(function(x){ for(var i=0;i<5;i++){ var cx=x-4+i*2; chairs.push([cx,LONG_Z+2.65,0]); chairs.push([cx,LONG_Z-2.65,Math.PI]); } });
chairs.push([-41.2-5.9,LONG_Z,-Math.PI/2]); chairs.push([54.8+5.9,LONG_Z,Math.PI/2]);
var matChair=new THREE.MeshStandardMaterial({color:0x8f8572,roughness:0.9});
(function(){
  var parts=[new THREE.BoxGeometry(1.4,0.15,1.4).translate(0,1.5,0), new THREE.BoxGeometry(1.4,1.5,0.12).translate(0,2.3,0.64),
             new THREE.BoxGeometry(0.1,1.45,1.3).translate(-0.62,0.725,0), new THREE.BoxGeometry(0.1,1.45,1.3).translate(0.62,0.725,0)];
  var d=new THREE.Object3D();
  parts.forEach(function(g){ var im=new THREE.InstancedMesh(g,matChair,chairs.length);
    chairs.forEach(function(c,i){ d.position.set(c[0],0,c[1]); d.rotation.set(0,c[2],0); d.updateMatrix(); im.setMatrixAt(i,d.matrix); });
    im.instanceMatrix.needsUpdate=true; extras.add(im); });
})();

var limits=new THREE.Group(); limits.visible=false; scene.add(limits);
function limitRect(y,label){
  var pts=[new THREE.Vector3(-14,y,-HALF),new THREE.Vector3(14,y,-HALF),new THREE.Vector3(14,y,HALF),new THREE.Vector3(-14,y,HALF)];
  var l=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xe0452c})); limits.add(l);
  var s=textSprite(label,1.1,'#ffffff','#c0392b'); s.position.set(15.6,y,HALF); limits.add(s);
}
limitRect(9,'9 ft'); limitRect(15,'15 ft');

var tgt=new THREE.Vector3(0,11.5,0), sph={r:30,th:0,ph:1.2};
function applyCam(){
  sph.ph=Math.max(0.02,Math.min(Math.PI-0.02,sph.ph)); sph.r=Math.max(2,Math.min(260,sph.r));
  camera.position.set(tgt.x+sph.r*Math.sin(sph.ph)*Math.sin(sph.th), tgt.y+sph.r*Math.cos(sph.ph), tgt.z+sph.r*Math.sin(sph.ph)*Math.cos(sph.th));
  camera.lookAt(tgt);
}
function setView(p,t,fov){
  tgt.set(t[0],t[1],t[2]); var dx=p[0]-t[0],dy=p[1]-t[1],dz=p[2]-t[2];
  sph.r=Math.sqrt(dx*dx+dy*dy+dz*dz); sph.th=Math.atan2(dx,dz); sph.ph=Math.acos(dy/sph.r);
  camera.fov=fov; camera.updateProjectionMatrix(); applyCam();
}
var VIEWS=[
 ['Audience, left side',[-30,5.5,0],[0,11.5,0],55],
 ['Audience, right side',[30,5.5,0],[0,11.5,0],55],
 ['On the dancefloor, looking up',[0,5.5,7],[0,13.5,0],68],
 ['From a corner',[-35,5.5,11],[0,11,0],50],
 ['High three-quarter',[-30,15,20],[0,11,0],45],
 ['Back of the dancefloor, facing the band',[0,5.5,12.5],[0,10.5,-4],70],
 ['From the stage',[0,7.5,-14],[0,11.5,2],75],
 ['Top',[0,95,0.01],[0,0,0],22],
 ['Side elevation',[-110,12.5,0],[0,12.5,0],14],
 ['End elevation',[0,12.5,110],[0,12.5,0],16]
];
var viewBar=document.getElementById('views'), viewBtns=[];
VIEWS.forEach(function(v,i){
  var b=document.createElement('button'); b.textContent=v[0]; b.setAttribute('aria-pressed','false');
  b.addEventListener('click',function(){ setView(v[1],v[2],v[3]); viewBtns.forEach(function(o){o.setAttribute('aria-pressed','false');}); b.setAttribute('aria-pressed','true'); });
  viewBar.appendChild(b); viewBtns.push(b);
});
function clearViewSel(){ viewBtns.forEach(function(o){o.setAttribute('aria-pressed','false');}); }

var pts={}, last=null;
function panBy(dx,dy){
  var k=sph.r*Math.tan(camera.fov*Math.PI/360)*2/stage.clientHeight;
  var right=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0), up=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1);
  tgt.addScaledVector(right,-dx*k).addScaledVector(up,dy*k);
}
canvas.addEventListener('contextmenu',function(e){e.preventDefault();});
canvas.addEventListener('pointerdown',function(e){ canvas.setPointerCapture(e.pointerId); pts[e.pointerId]={x:e.clientX,y:e.clientY,btn:e.button,shift:e.shiftKey}; last=null; });
canvas.addEventListener('pointermove',function(e){
  var p=pts[e.pointerId]; if(!p) return;
  var ids=Object.keys(pts);
  if(ids.length===1){
    var dx=e.clientX-p.x, dy=e.clientY-p.y;
    if(p.btn===2||p.shift){ panBy(dx,dy); } else { sph.th-=dx*0.006; sph.ph-=dy*0.006; }
    p.x=e.clientX; p.y=e.clientY; clearViewSel(); applyCam();
  } else if(ids.length===2){
    p.x=e.clientX; p.y=e.clientY;
    var a=pts[ids[0]], b=pts[ids[1]];
    var d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    if(last){ if(d>0) sph.r*=last.d/d; panBy(mx-last.mx,my-last.my); }
    last={d:d,mx:mx,my:my}; clearViewSel(); applyCam();
  }
});
function up(e){ delete pts[e.pointerId]; last=null; }
canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',function(e){ e.preventDefault(); sph.r*=Math.exp(e.deltaY*0.0012); clearViewSel(); applyCam(); },{passive:false});

function press(id,on){ document.getElementById(id).setAttribute('aria-pressed',on?'true':'false'); }
function setLook(show){
  press('lookShow',show); press('lookWork',!show);
  scene.background=new THREE.Color(show?0x08080c:0xd9d5cc);
  hemi.intensity=show?0.10:0.62; sun.intensity=show?0:0.38;
  glowLights.forEach(function(l){l.visible=show;});
  lanternMeshes.forEach(function(m){m.material=show?matLanternShow:matLanternWork;});
  glowMeshes.forEach(function(m){m.visible=show;});
  matFloor.color.set(show?0x3a3936:0xa9a59c); matDance.color.set(show?0x4a4640:0x8d887d);
  matWall.color.set(show?0x3c3a37:0xc4bfb5); matTable.color.set(show?0x8a857c:0xd8d3c8);
  matTruss.color.set(show?0x555555:0x7d7d7d); matChair.color.set(show?0x5d564a:0x8f8572); stageLight.visible=show; matBand.emissive.set(show?0x6f6a60:0x000000);
}
function setSpacing(inches){
  press('sp46',inches===46); press('sp36',inches===36);
  straps.forEach(function(g,k){ g.position.x=(k-3)*inches/12; });
}
document.getElementById('lookShow').addEventListener('click',function(){setLook(true);});
document.getElementById('lookWork').addEventListener('click',function(){setLook(false);});
document.getElementById('sp46').addEventListener('click',function(){setSpacing(46);});
document.getElementById('sp36').addEventListener('click',function(){setSpacing(36);});
function toggle(id,fn){ var b=document.getElementById(id); b.addEventListener('click',function(){ var on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',on?'true':'false'); fn(on); }); }
toggle('tIds',function(on){ idSprites.forEach(function(s){s.visible=on;}); });
toggle('tLim',function(on){ limits.visible=on; });
toggle('tRoom',function(on){ extras.visible=on; });

function resize(){ var w=stage.clientWidth,h=stage.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
if(window.ResizeObserver){ new ResizeObserver(resize).observe(stage); } else { window.addEventListener('resize',resize); }
resize(); setLook(true); setSpacing(46); viewBtns[0].click();
(function loop(){ renderer.render(scene,camera); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
